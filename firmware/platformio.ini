; PlatformIO Configuration for Edenia Villa Security Attendance System
; ESP32 + R307 Fingerprint Sensor + 16x2 I2C LCD + Direct WiFi HTTP

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Libraries
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    arduino-libraries/NTPClient@^3.2.1
    bblanchon/ArduinoJson@^7.0.0

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
