; PlatformIO Configuration for Edenia Villa Security Attendance System
; ESP32 + R307 Fingerprint Sensor + 16x2 I2C LCD + Adafruit IO MQTT

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Libraries
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.0
    adafruit/Adafruit MQTT Library@^2.5.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    arduino-libraries/NTPClient@^3.2.1

; Ignore WiFi101 and WiFiNINA — they conflict with ESP32's built-in WiFi
lib_ignore =
    WiFi101
    WiFiNINA_-_Adafruit_Fork

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
